<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deklination üben</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#2f5fd0">
  <script>
    // Apply the theme picked in the settings before the page is drawn
    try {
      const theme = localStorage.getItem('declination-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* storage unavailable: follow the system theme */ }

    // Phones get the phone page, unless a version was picked explicitly
    try {
      const view = localStorage.getItem('declination-view');
      if (view === 'mobile' || (view === null && matchMedia('(max-width: 640px) and (pointer: coarse)').matches)) {
        location.replace('mobile.html');
      }
    } catch { /* storage unavailable: stay on this page */ }
  </script>
</head>
<body>
  <main>
    <header>
      <div class="title">
        <h1>Deklination üben</h1>
        <button id="open-settings" class="icon-button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div class="stats">
        <div><span id="stat-shown">0</span><small>shown</small></div>
        <div><span id="stat-perfect">0</span><small>success</small></div>
        <div><span id="stat-errors">0</span><small>errors</small></div>
        <div><span id="stat-rate">–</span><small>accuracy</small></div>
        <div><span id="stat-streak">0</span><small>streak</small></div>
      </div>
    </header>

    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <fieldset>
        <legend>Exercises</legend>
        <div id="exercise-list"></div>
      </fieldset>
      <fieldset>
        <legend>Nouns</legend>
        <div id="pool-list"></div>
      </fieldset>
      <fieldset>
        <legend>Gender / number</legend>
        <div id="gender-list"></div>
      </fieldset>
      <fieldset>
        <legend>Cases</legend>
        <div id="case-list"></div>
      </fieldset>
      <fieldset>
        <legend>Appearance</legend>
        <div class="segmented" id="theme-choice" role="radiogroup" aria-label="Theme">
          <label><input type="radio" name="theme" value="system"> Device</label>
          <label><input type="radio" name="theme" value="light"> Light</label>
          <label><input type="radio" name="theme" value="dark"> Dark</label>
        </div>
      </fieldset>
      <p id="settings-error" class="error" hidden></p>
      <div class="dialog-actions">
        <a id="switch-view" href="mobile.html" data-view="mobile">Phone version</a>
        <button id="close-settings" class="primary">Done</button>
      </div>
    </dialog>

    <section id="card" class="card">
      <div class="prompt">
        <div class="case-badge" id="q-case"></div>
        <div class="exercise-name" id="q-exercise"></div>
        <div class="given">
          <span class="noun" id="q-noun"></span>
          <span class="gender" id="q-gender"></span>
          <span class="adjective" id="q-adj"></span>
        </div>
      </div>

      <div class="phrase" id="q-phrase"></div>

      <div id="slots"></div>

      <div class="result" id="result" hidden>
        <span id="result-text"></span>
        <button id="next" class="primary">Next ⏎</button>
      </div>
    </section>

    <section class="breakdown">
      <h2>Per exercise</h2>
      <table>
        <thead><tr><th>Exercise</th><th>Shown</th><th>Success</th><th>Errors</th><th>Accuracy</th></tr></thead>
        <tbody id="breakdown"></tbody>
      </table>
      <div class="actions">
        <button id="skip">Skip</button>
        <button id="reset" class="danger">Reset statistics</button>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
